name: daily

on:
  schedule:
    # The source is hukamnamasahib.com's morning page. Edits on the post's
    # own date (n=111) have a median of 05:09 IST, p75 05:21, p90 07:03.
    # Runs at 05:13, 06:43, 08:13, 10:43 and 16:37 IST, on minutes off the
    # hour to stay clear of GitHub's top-of-hour queue, which has run these
    # slots 3.8-5.3 h late. A run before posting finds the not-found page and
    # is a no-op; once a run has written the day, later runs reproduce the
    # same bytes and the `git diff --staged --quiet` guard skips the commit.
    # These times are provisional and will be revised from the run log.
    - cron: '43 23 * * *'
    - cron: '13 1 * * *'
    - cron: '43 2 * * *'
    - cron: '13 5 * * *'
    - cron: '7 11 * * *'
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 152 MB unpacked. Installed here, never committed.
      - name: Install pinned corpus
        run: npm install --no-save @shabados/database@4.8.7

      - name: Fetch and resolve
        env:
          SHABADOS_DB: node_modules/@shabados/database/build/database.sqlite
          SHABADOS_VERSION: 4.8.7
          # A stale page only fails the last scheduled run. Manual runs are
          # never final.
          FINAL_RUN: ${{ github.event.schedule == '7 11 * * *' && '1' || '' }}
        run: node bin/fetch-today.js

      - name: Commit
        run: |
          git config user.name  "hukamnama-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore(archive): $(TZ=Asia/Kolkata date +%F)"
            git push
          fi
