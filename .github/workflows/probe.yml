name: probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # One request, no retries, to check the runner can reach hukamnamasahib.com.
      - run: >-
          curl -sS -o /dev/null -w '%{http_code} %{content_type} %{size_download}\n'
          -A 'darbar-sahib-hukamnama-archive/0.1 (+https://github.com/Harkie21/darbar-sahib-hukamnama-archive; contact: harkiratsingh135790@gmail.com)'
          "https://hukamnamasahib.com/hukamnama/$(TZ=Asia/Kolkata date +%F)-morning"
